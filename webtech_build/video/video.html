<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>render</title>
<style>
:root{--bg:#0a1222;--bg2:#101b33;--card:#13213c;--card2:#182a4a;--line:#2b4572;--tx:#eaf1ff;--mu:#9fb2d4;--sky:#4cc3ff;--teal:#35d6c0;--amber:#ffc857;--rose:#ff7a8a;--green:#63d98f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:1280px;height:720px;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;color:var(--tx);font-family:ui-sans-serif,-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
 background:radial-gradient(1100px 620px at 12% -8%,#17335f 0%,transparent 60%),linear-gradient(160deg,#0b1428,#09101f)}
#grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.scene{position:absolute;inset:0}
.abs{position:absolute}
svg.ov{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible;pointer-events:none}
.chip{position:absolute;left:64px;top:30px;font-size:15px;letter-spacing:.14em;font-weight:700;color:var(--sky);text-transform:uppercase}
.part{position:absolute;right:64px;top:30px;font-size:15px;letter-spacing:.06em;color:var(--mu)}
.h{position:absolute;left:64px;top:56px;font-size:40px;font-weight:800;letter-spacing:-.01em;line-height:1.15;width:1150px}
.h::after{content:"";display:block;width:64px;height:4px;border-radius:2px;margin-top:10px;background:linear-gradient(90deg,var(--sky),var(--teal))}
.foot{position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(5,10,20,.7);border-top:1px solid #1c2e4e}
.foot .t{position:absolute;left:64px;top:8px;font-size:14px;color:var(--mu);letter-spacing:.05em}
.foot .bar{position:absolute;right:64px;top:14px;width:360px;height:5px;border-radius:3px;background:#1b2c4b;overflow:hidden}
.foot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--teal))}
.card{position:absolute;background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bul{display:flex;align-items:center;gap:18px;padding:0 24px}
.bul .n{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:21px;color:#06101f;background:var(--sky)}
.bul .tx{font-size:29px;line-height:1.25;font-weight:600}
.bul .sub{font-size:21px;color:var(--mu);font-weight:500;margin-top:4px}
b{color:var(--amber);font-weight:800}
em{color:var(--teal);font-style:normal;font-weight:700}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--sky);background:rgba(76,195,255,.12);padding:1px 7px;border-radius:6px;font-size:.92em}
.figcard{position:absolute;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.5);overflow:hidden}
.figcard img{position:absolute;display:block}
.hl{position:absolute;border:3.5px solid #ff4d6d;border-radius:10px;box-shadow:0 0 0 3px rgba(255,77,109,.25)}
.hlab{position:absolute;background:#ff4d6d;color:#fff;font-weight:800;font-size:19px;padding:4px 12px;border-radius:8px;white-space:nowrap}
table.tb{border-collapse:separate;border-spacing:0;font-size:24px;width:100%}
table.tb th{background:#1d3560;color:var(--amber);text-align:left;padding:12px 18px;font-size:22px;border-bottom:2px solid var(--line)}
table.tb td{padding:11px 18px;border-bottom:1px solid #223a63;vertical-align:top;line-height:1.28}
table.tb tr.row td:first-child{font-weight:700;color:var(--sky)}
.box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:0 8px 24px rgba(0,0,0,.35)}
.box .t{font-size:27px;font-weight:800;line-height:1.15}.box .s{font-size:18px;color:var(--mu);margin-top:6px;line-height:1.25}
.c-sky{border-color:var(--sky)}.c-teal{border-color:var(--teal)}.c-amber{border-color:var(--amber)}.c-rose{border-color:var(--rose)}.c-green{border-color:var(--green)}
.pkt{position:absolute;padding:6px 14px;border-radius:999px;background:var(--amber);color:#0a1222;font-weight:800;font-size:19px;white-space:nowrap;box-shadow:0 0 18px rgba(255,200,87,.6)}
.act{position:absolute;padding:10px 18px;border-radius:14px;background:#1d3560;border:2px solid var(--sky);font-weight:800;font-size:25px;text-align:center}
.mlab{position:absolute;font-size:20px;font-weight:700;text-align:center;white-space:nowrap;color:var(--tx)}
.note{position:absolute;font-size:19px;color:var(--mu);font-style:italic}
.codep{position:absolute;background:#0b1220;border:1.5px solid var(--line);border-radius:14px;padding:14px 0;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cl{position:absolute;left:0;right:0;font-family:ui-monospace,"SF Mono",Menlo,monospace;white-space:pre;padding-left:18px;color:#d7e3ff}
.cl .k{color:#ff8fa3}.cl .s{color:#9be59b}.cl .c{color:#6f86ad}.cl .t{color:#6fd0ff}.cl .n{color:#ffc857}.cl .a{color:#ffd98a}
.cbar{position:absolute;left:6px;right:6px;border-radius:8px;background:rgba(76,195,255,.16);border-left:4px solid var(--sky)}
.out{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.out.br{background:#fff;color:#111}
.out .bh{height:30px;background:#dde3ee;display:flex;align-items:center;gap:7px;padding-left:12px}
.out .bh i{width:11px;height:11px;border-radius:50%;background:#aab4c6;display:block}
.out .bh span{margin-left:10px;font-size:14px;color:#44546e;background:#fff;border-radius:6px;padding:2px 10px}
.out .bd{padding:16px 20px;font-size:20px;line-height:1.4;font-family:Arial,Helvetica,sans-serif;color:#111}
.out.tx{background:#06101f;border:1.5px solid var(--line)}
.out.tx .bd{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#9be59b;font-size:20px;line-height:1.45;padding:12px 16px;white-space:pre}
.out .ol{position:absolute;left:0;top:-1px;font-size:13px;letter-spacing:.14em;font-weight:800;color:var(--teal);padding:3px 12px}
.tbig{position:absolute;left:0;width:1280px;text-align:center;font-weight:800}
.vs{position:absolute;font-weight:900;font-size:30px;color:var(--amber)}
.map{position:absolute;display:flex;align-items:center;gap:20px}
.map .l,.map .r{padding:14px 22px;border-radius:14px;font-size:27px;font-weight:700;background:#14264a;border:1.5px solid var(--line)}
.map .l{color:var(--amber);border-color:#6b5a2a}
.map .r{color:var(--sky);border-color:#27567a}
.map .ar{font-size:30px;color:var(--mu)}
</style></head>
<body>
<div id="stage"><div id="grain"></div><div id="root"></div>
<div class="foot"><span class="t" id="ft"></span><div class="bar"><i id="fb"></i></div></div></div>
<script src="engine.js"></script>
</body></html>
